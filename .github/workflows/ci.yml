name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The mcp extra is installed on purpose. Without it build_server()
          # raises before it reaches fastmcp, the protocol tests in
          # tests/test_mcp_protocol.py skip, and the whole MCP layer, which is
          # the only part of this project a client ever touches, ships
          # unexercised. That is exactly how `fastmcp>=2.0` stayed in this file
          # while every release below 2.2.7 failed to start the server.
          pip install -e ".[mcp,dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: The tools are importable with no MCP client installed
        run: |
          # The stdlib-only promise, checked rather than asserted. In a throwaway
          # environment with no fastmcp, the two tools must still import and the
          # server must refuse with a message naming the extra.
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet -e .
          /tmp/bare/bin/python - <<'PY'
          from science2code.server import build_server, find_passage, verify_quote
          assert callable(verify_quote) and callable(find_passage)
          try:
              build_server()
          except RuntimeError as exc:
              assert "fastmcp" in str(exc), exc
              print("refused cleanly:", exc)
          else:
              raise SystemExit("build_server() should have refused without fastmcp")
          PY

  style:
    name: house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No em dashes or en dashes
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys

          # The project style forbids both, in code, comments and docs alike.
          # Use commas, colons, parentheses, separate sentences, or "to" for
          # ranges. Only tracked files are checked.
          BAD = {"\u2014": "em dash", "\u2013": "en dash"}
          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, text=True, check=True
          ).stdout.split("\0")

          hits = []
          for name in filter(None, tracked):
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  for char, label in BAD.items():
                      if char in line:
                          hits.append(f"{name}:{lineno}: {label}: {line.strip()[:120]}")

          if hits:
              print("\n".join(hits))
              print(f"::error::{len(hits)} line(s) contain an em dash or an en dash.")
              sys.exit(1)
          print("clean")
          PY
